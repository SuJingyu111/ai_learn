name: cpu-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} / CPU
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CPU-only release build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_CUDA=OFF
          -DENABLE_STRICT_WARNINGS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Verifies the benchmark runs and emits well-formed, provenance-tagged
      # output. A shared CI runner cannot produce performance evidence; the
      # provenance header says so, and Orin remains the source of truth.
      - name: Smoke benchmark
        env:
          TT_COMMIT: ${{ github.sha }}
          TT_HOST: github-actions-${{ runner.os }}-${{ runner.arch }}-shared
        run: ./build/resize_benchmark 30 | tee cpu-benchmark.csv

      - name: Upload benchmark artifact
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: cpu-benchmark-${{ github.sha }}
          path: cpu-benchmark.csv
          retention-days: 14

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check C++ and CUDA formatting
        run: ./scripts/check_format.sh

  # The "every step ends in something you can run" guarantee is mechanical,
  # not a matter of discipline. It runs on every change rather than when
  # someone remembers the command.
  step-structure:
    name: Step structure and links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate step sequence, runnable blocks, and local links
        run: python3 scripts/validate_steps.py

